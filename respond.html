<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submission Received - Maternal Health Monitoring</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .confirmation-card {
            max-width: 500px;
            width: 90%;
            padding: 40px;
            border-radius: 20px;
            border: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
        }
        .success-icon {
            font-size: 4rem;
            color: #198754;
        }
    </style>
</head>
<body>

    <div class="card confirmation-card text-center bg-white">
        <div class="card-body">
            <div class="mb-4">
                <i class="bi bi-check2-circle success-icon"></i>
            </div>
            
            <h2 class="fw-bold text-dark mb-3">Thank You!</h2>
            <p class="text-muted fs-5 mb-4">
                Your health data has been submitted successfully. 
                <strong>We will respond to you shortly</strong> after our medical team reviews your record.
            </p>

            <hr class="my-4">

            <div class="d-grid gap-2">
                <a href="index.html" class="btn btn-primary btn-lg rounded-pill">
                    Return to Home
                </a>
                <!-- <a href="Acess-form.html" class="btn btn-outline-secondary rounded-pill">
                    View My Records
                </a> -->
            </div>
        </div>
        
        <div class="card-footer bg-transparent border-0 mt-3">
            <small class="text-muted">Need urgent help? Call <span class="text-primary">911</span> or your doctor.</small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
